name: hala_soccer
description: Hala Soccer — live scores, fixtures, and results.

publish_to: 'none'

version: 2.0.0+1

environment:
  sdk: ^3.11.0

dependencies:
  flutter:
    sdk: flutter

  cupertino_icons: ^1.0.8
  flutter_svg: ^2.0.10+1
  http: ^1.2.1
  flutter_dotenv: ^5.1.0

  # State management
  flutter_riverpod: ^2.5.1

  # Routing (drives the splash -> onboarding -> auth -> home flow)
  go_router: ^14.2.0

  # Auth token + local persistence
  flutter_secure_storage: ^9.2.2
  shared_preferences: ^2.2.3

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true

  assets:
    - assets/imgs/
    - .env

  # To add custom fonts to your application, add a fonts section here.
  # v1 shipped no custom fonts; the 2.0 design system intentionally keeps
  # the platform default font (see core/theme/app_typography.dart).

